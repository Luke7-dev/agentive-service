# Prometheus scrape configuration for the local Agentive Service stack.
#
# The NestJS app runs OUTSIDE Docker (the existing dev workflow — e.g.
# `npm run start:dev`, default port 3000), so Prometheus reaches it via
# Docker's host-gateway hostname rather than a container name.
#
# If the app's port changes (the PORT environment variable in
# agentive-service/.env), update the target below to match, then run
# `docker compose restart prometheus` to pick up the change.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: agentive-service
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:3000']
